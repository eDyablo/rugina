[package]
name = "repolet"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tempfile = "3.24"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }
